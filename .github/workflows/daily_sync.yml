name: Relif → Sheets Sync

on:
  schedule:
    # Corre a las 09:00 UTC = 06:00 Chile (CLT, UTC-3)
    # Ajusta el horario si usas horario de verano (CLST, UTC-4)
    - cron: "0 9 * * *"

  # Permite correr manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  sync:
    name: Sync Relif data to Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr sync
        env:
          RELIF_EMAIL: ${{ secrets.RELIF_EMAIL }}
          RELIF_PASSWORD: ${{ secrets.RELIF_PASSWORD }}
          RELIF_JWT_TOKEN: ${{ secrets.RELIF_JWT_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python sync.py
